name: capstone

channels:
  - conda-forge

dependencies:
  - python=3.11
  - numpy
  - pandas
  - scipy
  - scikit-learn
  - pytest
  - matplotlib
  - seaborn
  - ipykernel
  - nbconvert
  - pytorch=2.13
  - pip
  - pip:
      - datasets>=3.1
      - pyyaml>=6,<7
      - transformers>=5.4,<6
      - accelerate>=0.23
      - sae-lens==6.49.1
      - shap
      - lime
      - boto3>=1.35,<2
      - python-dotenv>=1,<2
      - anthropic>=1.13  # only for scripts/ai_ml/anthropic_claude.py
