# L1 decomposition (issue #146), layer 25: is the L1 effect one feature? Feature 7025 fires on ~100% of
# fit-partition rows with a mean activation of ~46, far above the other targeted L1 features. Its subsets run as their
# own experiments, each with its own contribution-matched random draws: 7025 alone, and the other nine without it,
# beside the full set. Norm-matched edits compare them at equal size; scaling by (1 +/- 0.5) is the on-manifold
# alternative to the negative clamps of the steering run. Needs the same reference file as
# configs/causal_edit_size_layer25.yaml.
#
# Per episode: plain replay + 3 sets x (targeted + 5 random draws) x (ablation + 4 norm-matched + 2 scaled edits)
# = 127 generations, about 13.4 h for 450 episodes.
capstone_data_root: .
# intervention episodes from the natural_4b_full9 run (separate intervention-only export)
interactions_jsonl: results/collection/natural_4b_full9_intervention_partitioned/intervention/interactions.jsonl
labels_csv: results/behavior/behavior_v012_official_20261011/labels.csv
partition: intervention
# targeted features per SAE and the SAE hashes they belong to (random draws are redrawn, below)
feature_selection_summary: results/feature_selection/20261018T025217187826Z/feature_selection_summary.json
musique_revision: c8f4f8c9465fb69d31a8eae894c3fd509c4ca321
layer: 25
solver:
  id: google/gemma-3-4b-it
  revision: 093f9f388b31de276ce2de164bdc2081324b9767
  loader: gemma3
  dtype: bfloat16
  device: cuda:0
  generation: {max_new_tokens: 64, do_sample: false}
saes:
  L1 SAE:
    kind: custom
    path: results/sae/musique/runs/layer_25/20261017T155339052216Z-2f1f8393aedd
feature_reference: results/feature_selection/20261018T025217187826Z/feature_reference_activations.json
# plain replay must reproduce collection before any SAE condition runs (see replay_check.json)
min_replay_label_match: 0.98
on_replay_check_fail: stop
seed: 42
n_bootstrap: 1000
n_permutations: 10000
# random controls matched on firing frequency and decoded contribution (RMS activation x decoder norm),
# drawn from the per-latent statistics in feature_reference (add them first: see the top of this file)
random_controls: contribution
n_random_draws: 5
targeted_subsets:
  L1 SAE:
    f7025: [7025]
    without_7025: [4428, 4153, 1232, 456, 5438, 9006, 12634, 4819, 8119]
reconstruction: false
error_preserving: true
ablation: true
edit_norms: [-1.0, -0.25, 0.25, 1.0]
scale_fractions: [-0.5, 0.5]
max_hours: 15
output_dir: results/causal_edit_size
