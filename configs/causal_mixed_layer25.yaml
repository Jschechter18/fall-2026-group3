# Broader comparison, separate from the focused TopK preset. No additional scientific CLI flags.
capstone_data_root: .
partition: intervention
layer: 25
interactions_jsonl: artifacts/collection/mixed_final_001/prepared/results/mixed_final_001_intervention/intervention/interactions.jsonl
contexts_jsonl: artifacts/collection/mixed_final_001/prepared/results/mixed_final_001_intervention/contexts.jsonl
labels_csv: results/behavior/mixed_final_001_intervention_claude/labels.csv
label_policy: claude
claude:
  source_run: results/claude_validation/mixed_final_001/intervention
  source_errors: exclude
  generated_errors: stop
  concurrency: 64
  aws_profile: school
  region: us-east-1
feature_selection_summary: results/feature_selection_pretrained_adapted_layer25/20261102T210433855083Z/feature_selection_summary.json
input_preparation:
  collection_results: artifacts/collection/mixed_final_001/prepared/results/mixed_final_001_intervention
solver:
  id: google/gemma-3-4b-it
  revision: 093f9f388b31de276ce2de164bdc2081324b9767
  loader: gemma3
  dtype: bfloat16
  device: cuda:0
  generation: {max_new_tokens: 64, do_sample: false}
saes:
  Raw activations:
    kind: activations
    path: results/probe_mixed_final_001_layer25/centers/raw_layer25.npy
  L1 SAE:
    kind: custom
    path: results/sae/musique/runs/layer_25/20261102T182346930753Z-150e78c341c6
  TopK SAE:
    kind: custom
    path: results/sae/musique/runs/layer_25/20261102T182749413400Z-150e78c341c6
  Pretrained SAE:
    kind: gemma_scope
    path: results/sae/pretrained/gemma-scope-2-4b-it/resid_post_all/layer_25_width_16k_l0_big
  # Same encoder as the Pretrained SAE (identical features); decoder only fine-tuned on mixed_final_001
  # train, 10 epochs at lr 1e-5. Chosen before any intervention result: validation variance explained
  # 0.225 -> 0.794 (probe cohort 0.238 -> 0.770). The 14 targeted features keep decoder cosine 0.928-0.996
  # with the original. The 15-epoch run (20261104T165208970599Z) drifted further for +0.02 and is not used.
  Adapted pretrained SAE:
    kind: gemma_scope
    path: results/sae/decoder_finetuning/20261104T164310458065Z/best
# This is the exported feature-selection probe, distinct from the earlier unweighted offline readout.
probe_direction: results/feature_selection_pretrained_adapted_layer25/20261102T210433855083Z/probe_direction_layer25_Raw_activations.npz
random_controls: frequency
n_random_draws: 5
random_directions: 3
reconstruction: false
error_preserving: true
ablation: true
scale_fractions: [-0.5]
edit_norms: [-0.01, -0.02]
norm_edit_policy: cap_at_ablation
min_replay_label_match: 0.98
on_replay_check_fail: stop
seed: 42
limit: 20
n_bootstrap: 1000
n_permutations: 10000
output_dir: results/causal_mixed_layer25
