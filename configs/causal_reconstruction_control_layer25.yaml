# Control 1 (#220): each SAE spliced in with no ablation, i.e. the Solver run on decode(encode(x)) at the
# edit site, against the plain replay. This measures reconstruction damage, which is not the no-SAE baseline;
# analyse it separately and never pool it with the error-preserving effects of the other configs.
# The reconstruction splice always generates its targeted and random ablations too; with one draw they are
# descriptive only. Same inputs, cohort and seed as causal_pretrained_layer25.yaml.
capstone_data_root: .
partition: intervention
layer: 25
interactions_jsonl: artifacts/collection/mixed_final_001/prepared/results/mixed_final_001_intervention/intervention/interactions.jsonl
contexts_jsonl: artifacts/collection/mixed_final_001/prepared/results/mixed_final_001_intervention/contexts.jsonl
labels_csv: results/behavior/mixed_final_001_intervention_claude/labels.csv
label_policy: claude
claude:
  source_run: results/claude_validation/mixed_final_001/intervention
  source_errors: exclude  # the three audited technical failures never enter the binary cohort
  generated_errors: exclude_episode  # the policy of the TopK analysis (merged_exclude_empty6), set before the run
  concurrency: 64
  aws_profile: school    # used only by the coordinator's --label-only stage
  region: us-east-1
feature_selection_summary: results/feature_selection_pretrained_adapted_layer25/20261102T210433855083Z/feature_selection_summary.json
feature_reference: results/feature_selection_pretrained_adapted_layer25/20261102T210433855083Z/feature_reference_activations.json
input_preparation:
  collection_results: artifacts/collection/mixed_final_001/prepared/results/mixed_final_001_intervention
  feature_selection_config: configs/feature_selection/feature_selection_pretrained_adapted_layer25.yaml
solver:
  id: google/gemma-3-4b-it
  revision: 093f9f388b31de276ce2de164bdc2081324b9767
  loader: gemma3
  dtype: bfloat16
  device: cuda:0
  generation: {max_new_tokens: 64, do_sample: false}
saes:
  TopK SAE:
    kind: custom
    path: results/sae/musique/runs/layer_25/20261102T182749413400Z-150e78c341c6
  Pretrained SAE:
    kind: gemma_scope
    path: results/sae/pretrained/gemma-scope-2-4b-it/resid_post_all/layer_25_width_16k_l0_big
  Adapted pretrained SAE:
    kind: gemma_scope
    path: results/sae/decoder_finetuning/20261102T205853702830Z/best
random_controls: contribution
n_random_draws: 1
random_directions: 0
reconstruction: true
error_preserving: false
ablation: true
edit_norms: []
norm_edit_policy: cap_at_ablation
min_replay_label_match: 0.98
on_replay_check_fail: stop
seed: 42
# Initial timing/feasibility pilot only. 10 generations per episode; choose full-run scope after timing.
limit: 5
n_bootstrap: 1000
n_permutations: 10000
output_dir: results/causal_reconstruction_control_layer25
