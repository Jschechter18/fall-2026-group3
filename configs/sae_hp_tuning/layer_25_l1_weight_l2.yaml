# Explicit L2 weight-penalty pilot, not AdamW weight decay.
# Fix the strongest prior layer-25 L1 reconstruction baseline (~60 active/input).
activation_run_name: natural_4b_full9_partitioned
layer: 25

defaults:
  latent_dim: 12888
  epochs: 200
  batch_size: 256
  seed: 42
  train_shuffle: true
  patience: 20
  early_stopping_min_delta: 0.0001
  lr_patience: 5
  inactivity_window_examples: 10000

groups:
  - name: l1_weight_l2
    fixed:
      sparsity_mode: l1
      lr: 0.0001
      sparsity_coefficient: 2.0
      tied_initialization: true
      aux_coefficient: 0.0
    grid:
      # Sum of squares, not mean: coefficients depend on dictionary size and
      # normalized reconstruction units. Include zero and a broad log sweep.
      weight_l2_coefficient: [0.0, 0.00000001, 0.0000001, 0.000001, 0.00001, 0.0001]

# Validation-only pilot; manually compare reconstruction, sparsity, and coverage.
# No automatic selection or resampling. Independent training seeds come next.
