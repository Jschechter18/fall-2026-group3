# Example search; use --dry-run to inspect the eight resolved trials.
# Each study receives an automatic timestamp + Git commit ID.
activation_run_name: natural_4b_full9_partitioned
layer: 33

defaults:
  epochs: 200
  seed: 42
  patience: 20
  lr_patience: 5

groups:
  - name: l1_small
    fixed:
      sparsity_mode: l1
      latent_dim: 4096
      batch_size: 256
    grid:
      lr: [0.0001, 0.0003]
      sparsity_coefficient: [0.01, 0.1]

  - name: topk_scaled
    fixed:
      sparsity_mode: topk
      batch_size: 256
    grid:
      lr: [0.0001, 0.0003]
    variants:
      - latent_dim: 4096
        top_k: 64
      - latent_dim: 8192
        top_k: 128

# Optional: choose the lowest reconstruction loss under an activity budget.
# Without this section, review the Pareto frontier before choosing a trial.
# selection:
#   max_mean_active_features: 128
