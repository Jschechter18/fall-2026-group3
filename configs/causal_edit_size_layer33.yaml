# Edit-size-matched causal replay (issue #146), layer 33. The steering run (configs/causal_steering_layer33.yaml)
# compared edits of very different sizes: the targeted L1 edits were 14-37x larger than their random controls, and
# behaviour only changed for edits above about 0.4 |x|. Here every targeted and random edit has the same size: the
# ablation edit of the set (what its features contribute at that position) is rescaled to r * |x|, removed (r < 0)
# or added (r > 0), with the error-preserving splice (x + edit) so each SAE's reconstruction error stays out of it.
# Full ablation is kept as the unscaled estimand.
#
# First add per-latent statistics to the reference file (it keeps the same per-feature values):
#   python scripts/feature_reference_activations.py --config configs/feature_selection_layer33.yaml \
#       --summary results/feature_selection/20261016T003252665105Z/feature_selection_summary.json --overwrite
#
# L1 decomposition: feature 8023 fires on ~100% of fit-partition rows with a mean activation of ~46, far above
# the other targeted L1 features, so its subsets run as their own experiments, each with its own matched draws:
# 8023 alone and the other nine without it, beside the full set.
#
# Per episode: plain replay + (3 SAEs + 2 L1 subsets) x (targeted + 5 random draws) x (ablation + 8 norm-matched
# edits) + 3 random directions x 8 norm-matched edits = 295 generations: about 35.0 h for all 517
# eligible episodes at 0.826 s each.
#
# PRELIMINARY (dose-finding) run: 5 random draws and a grid of doses, to see where targeted and random edits separate
# at all. The confirmatory run will fix 1-2 doses from this one and use more draws (each draw costs one generation per
# dose, SAE and episode, so 100 draws over this whole grid would be ~540 GPU-hours).
capstone_data_root: .
# intervention episodes from the natural_4b_full9 run (separate intervention-only export)
interactions_jsonl: results/collection/natural_4b_full9_intervention_partitioned/intervention/interactions.jsonl
labels_csv: results/behavior/behavior_v012_official_20261011/labels.csv
partition: intervention
# targeted features per SAE and the SAE hashes they belong to (random draws are redrawn, below)
feature_selection_summary: results/feature_selection/20261016T003252665105Z/feature_selection_summary.json
musique_revision: c8f4f8c9465fb69d31a8eae894c3fd509c4ca321
layer: 33
solver:
  id: google/gemma-3-4b-it
  revision: 093f9f388b31de276ce2de164bdc2081324b9767
  loader: gemma3
  dtype: bfloat16
  device: cuda:0
  generation: {max_new_tokens: 64, do_sample: false}
saes:
  TopK SAE:
    kind: custom
    path: results/sae/musique/runs/layer_33/20261013T233444019723Z-e5943205b957
  L1 SAE:
    kind: custom
    path: results/sae/musique/runs/layer_33/20261014T161949048498Z-edfc89a42125
  Pretrained SAE:
    kind: gemma_scope
    path: results/sae/pretrained/gemma-scope-2-4b-it/resid_post_all/layer_33_width_16k_l0_big
feature_reference: results/feature_selection/20261016T003252665105Z/feature_reference_activations.json
# plain replay must reproduce collection before any SAE condition runs (see replay_check.json)
min_replay_label_match: 0.98
on_replay_check_fail: stop
seed: 42
n_bootstrap: 1000
n_permutations: 10000
# random controls matched on firing frequency and decoded contribution (RMS activation x decoder norm),
# drawn from the per-latent statistics in feature_reference (add them first: see the top of this file)
random_controls: contribution
n_random_draws: 5
# SAE-free control at the same edit sizes, never a no-op (e.g. for an always-on feature like 8023)
random_directions: 3
# subsets of a targeted set, each its own experiment (L1 SAE · f8023, ...) with its own draws
targeted_subsets:
  L1 SAE:
    f8023: [8023]
    without_8023: [8545, 3513, 1446, 1416, 694, 8037, 6848, 6254, 2912]
reconstruction: false
error_preserving: true
ablation: true
edit_norms: [-1.0, -0.5, -0.25, -0.1, 0.1, 0.25, 0.5, 1.0]
# warn if the SAE conditions are projected to take longer than this
max_hours: 38
output_dir: results/causal_edit_size
