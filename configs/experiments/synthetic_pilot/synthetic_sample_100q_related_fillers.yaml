# Paired filler ablation of synthetic_sample_100q_pilot (#174): the same 100 questions, evidence and
# generated distractors, with only the filler paragraphs replaced by related ones
# (scripts/experiments/swap_synthetic_fillers.py, seed 42).
# Run from the repository root with scripts/collect_activations.py. No question generation or Bedrock calls.
# The questions are listed in the original pilot's order, so per-question seeds and candidate orders match it.
# Everything below the dataset block is identical to configs/collection/synthetic_sample_100q_pilot.yaml.
roles:
  solver:
    id: google/gemma-3-4b-it
    revision: 093f9f388b31de276ce2de164bdc2081324b9767
    loader: gemma3
    dtype: bfloat16
    device: cuda:0
    generation:
      max_new_tokens: 64
      do_sample: false
  critic:
    id: Qwen/Qwen3-4B-Instruct-2507
    revision: cdbee75f17c01a7cc42f958dc650907174af0554
    loader: qwen3
    dtype: bfloat16
    device: cuda:0
    generation:
      max_new_tokens: 1024
      do_sample: false
  validator:
    id: google/gemma-3-4b-it
    revision: 093f9f388b31de276ce2de164bdc2081324b9767
    loader: gemma3
    dtype: bfloat16
    device: cuda:0
    generation:
      max_new_tokens: 4
      do_sample: false
dataset:
  path: data/MuSiQue/synthetic/runs/ablation/pilot100_related_fillers_seed42/accepted.jsonl
  source_split: train
  num_questions: 100
  sampling:
    strategy: listed
    question_ids_file: data/MuSiQue/synthetic/runs/ablation/pilot100_related_fillers_seed42/question_ids.json
collection:
  protocol_version: v2
  active_conditions:
  - natural
  a2_presentations:
  - candidates
  layers:
  - 4
  - 8
  - 17
  - 25
  - 29
  - 30
  - 31
  - 32
  - 33
  seed: 42
output:
  run_name: synthetic_sample_100q_related_fillers
  chunk_size: 10
