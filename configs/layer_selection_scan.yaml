# Layer selection on the nine-layer SCAN (partitioned export): fit on `train`, rank on `validation`.
# Eligible scan rows: train 445 (53 not adopted), validation 130 (13 not adopted), so validation CIs are
# wide; a tie or "not above chance" is a valid outcome. test and intervention rows are never read.
# Historical evidence: Behavior v0.1.1 labels on the 2,500-question layer-scan activations. The
# updated run on v0.1.2 labels and the full nine-layer export (full_index) is tracked in Issue #88.
capstone_data_root: data/capstone-data
activations_dir: natural_4b_layer_scan_partitioned/data/activations/natural_4b_layer_scan_partitioned
results_dir: natural_4b_layer_scan_partitioned/results/collection/natural_4b_layer_scan_partitioned
labels_csv: behavior_v011_split80_10_10_20261006/labels.csv
manifest_csv: behavior_v011_split80_10_10_20261006/split_manifest.csv
index_column: scan_index
layers: [8, 12, 17, 21, 25, 28, 30, 31, 33]
protocol: holdout
fit_partition: train
eval_partition: validation
text_fields: [solver_attempt_1, critic_advocated_answer, critic_feedback]
seed: 42
c_grid: [0.001, 0.01, 0.1, 1.0, 10.0, 100.0]          # tuned INSIDE the train rows (inner grouped CV)
inner_folds: 3
n_bootstrap: 1000
n_permutations: 0                                     # ~20 = label-shuffle control on the top layer
output_dir: results/layer_selection_scan
