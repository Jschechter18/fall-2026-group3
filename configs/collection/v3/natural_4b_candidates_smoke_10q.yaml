# Smoke of the candidates collection: the first 10 pilot questions, both A2
# presentations, production layers and budgets. Checks the run end to end
# (record fields, one activation row per A2, export); not analysed.
# Critic budget 1,024 tokens: at 256 every noncommittal row of the earlier
# sample was a truncated explanation, not a missing answer.

roles:
  solver:
    id: google/gemma-3-4b-it
    revision: 093f9f388b31de276ce2de164bdc2081324b9767
    loader: gemma3
    dtype: bfloat16
    device: cuda:0
    generation: {max_new_tokens: 64, do_sample: false}

  critic:
    id: Qwen/Qwen3-4B-Instruct-2507
    revision: cdbee75f17c01a7cc42f958dc650907174af0554
    loader: qwen3
    dtype: bfloat16
    device: cuda:0
    generation: {max_new_tokens: 1024, do_sample: false}

  validator:
    id: google/gemma-3-4b-it
    revision: 093f9f388b31de276ce2de164bdc2081324b9767
    loader: gemma3
    dtype: bfloat16
    device: cuda:0
    generation: {max_new_tokens: 4, do_sample: false}

dataset:
  revision: c8f4f8c9465fb69d31a8eae894c3fd509c4ca321
  source_split: train
  num_questions: 10
  sampling:
    strategy: listed
    question_ids_file: configs/collection/v3/smoke_question_ids.json

collection:
  protocol_version: v2
  active_conditions: [natural]
  a2_presentations: [feedback, candidates]
  layers: [4, 8, 17, 25, 29, 30, 31, 32, 33]
  seed: 42

output:
  run_name: natural_4b_candidates_smoke_10q
  chunk_size: 5
