# Candidates collection, MuSiQue train (19938 questions). Pairs with
# natural_4b_full9_candidates_validation.yaml under the same run_name.
# Same models, revisions, layers and seed as natural_4b_full9; A2 uses the
# candidates presentation only, and the Critic budget is 1,024 tokens.
# Start only after the pilot (natural_4b_candidates_pilot_300q.yaml) passes.
#
# Partitions are not assigned here. After collecting, build the package with
# scripts/evaluation/prepare_behavior_v01.py --frozen-partitions, which keeps every
# question's recorded partition and rebuilds only the activation indices.
# sampling.strategy random over the whole split selects it in a seeded
# shuffled order. Resumable: rerun with --resume after interruption.

roles:
  solver:
    id: google/gemma-3-4b-it
    revision: 093f9f388b31de276ce2de164bdc2081324b9767
    loader: gemma3
    dtype: bfloat16
    device: cuda:0
    generation: {max_new_tokens: 64, do_sample: false}

  critic:
    id: Qwen/Qwen3-4B-Instruct-2507
    revision: cdbee75f17c01a7cc42f958dc650907174af0554
    loader: qwen3
    dtype: bfloat16
    device: cuda:0
    generation: {max_new_tokens: 1024, do_sample: false}

  validator:
    id: google/gemma-3-4b-it
    revision: 093f9f388b31de276ce2de164bdc2081324b9767
    loader: gemma3
    dtype: bfloat16
    device: cuda:0
    generation: {max_new_tokens: 4, do_sample: false}

dataset:
  revision: c8f4f8c9465fb69d31a8eae894c3fd509c4ca321
  source_split: train
  num_questions: 19938
  sampling:
    strategy: random

collection:
  protocol_version: v2
  active_conditions: [natural]
  a2_presentations: [candidates]
  layers: [4, 8, 17, 25, 29, 30, 31, 32, 33]
  seed: 42

output:
  run_name: natural_4b_full9_candidates
  chunk_size: 250
