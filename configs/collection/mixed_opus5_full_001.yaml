# Mixed MuSiQue + synthetic collection. Run from the repository root.
# Requires the distributed collection implementation on main.
# Prepare .jsonl copies of the existing MuSiQue clean files; their .json files are JSONL.
# MuSiQue version is a local snapshot label, not an asserted Hugging Face revision.
# The prepared manifest records SHA-256 hashes of all input files.
# Retains main's example models, nine layers, candidate presentation, and split settings.
# 10% intervention; remaining questions split 80/10/10 train/validation/test.
# Generation provenance below is a release reference; sidecars are not automatically joined.
# Choose a new run name/output root for any new experiment.
roles:
  solver:
    id: google/gemma-3-4b-it
    revision: 093f9f388b31de276ce2de164bdc2081324b9767
    loader: gemma3
    dtype: bfloat16
    device: cuda:0
    generation:
      max_new_tokens: 64
      do_sample: false
  critic:
    id: Qwen/Qwen3-4B-Instruct-2507
    revision: cdbee75f17c01a7cc42f958dc650907174af0554
    loader: qwen3
    dtype: bfloat16
    device: cuda:0
    generation:
      max_new_tokens: 1024
      do_sample: false
  validator:
    id: google/gemma-3-4b-it
    revision: 093f9f388b31de276ce2de164bdc2081324b9767
    loader: gemma3
    dtype: bfloat16
    device: cuda:0
    generation:
      max_new_tokens: 4
      do_sample: false
dataset:
  inputs:
  - source: musique
    version: musique-clean-local-v1
    source_split: train
    path: data/MuSiQue/clean/train.jsonl
  - source: musique
    version: musique-clean-local-v1
    source_split: validation
    path: data/MuSiQue/clean/validation.jsonl
  - source: synthetic
    version: opus5-v3-full-001
    path: data/MuSiQue/synthetic/runs/opus5-v3-full-001/generation/accepted.jsonl
    generation_provenance:
      run_id: opus5-v3-full-001
      artifacts_dir: data/MuSiQue/synthetic/runs/opus5-v3-full-001/generation
      record_join_key: id -> provenance.jsonl record_id
  intervention:
    fraction: 0.1
    seed: 42
  split:
    proportions:
      train: 0.8
      validation: 0.1
      test: 0.1
    seed: 43
collection:
  protocol_version: v2
  active_conditions:
  - natural
  a2_presentations:
  - candidates
  layers:
  - 4
  - 8
  - 17
  - 25
  - 29
  - 30
  - 31
  - 32
  - 33
  seed: 42
output:
  run_name: mixed_opus5_full_001
  chunk_size: 50
