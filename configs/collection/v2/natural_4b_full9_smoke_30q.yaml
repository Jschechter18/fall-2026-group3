# Smoke test for the nine-layer collection: 30 MuSiQue-train questions with
# exactly the settings of natural_4b_full9_train.yaml, under its own run name.
# Two purposes: prove the nine-layer path end to end (tensors, indices,
# frozen-partition package, export), and measure drift against the recorded
# four-layer run, which covered every train question, by comparing A1, the
# Critic's feedback and A2 for the same question ids.

roles:
  solver:
    id: google/gemma-3-4b-it
    revision: 093f9f388b31de276ce2de164bdc2081324b9767
    loader: gemma3
    dtype: bfloat16
    device: cuda:0
    generation: {max_new_tokens: 64, do_sample: false}

  critic:
    id: Qwen/Qwen3-4B-Instruct-2507
    revision: cdbee75f17c01a7cc42f958dc650907174af0554
    loader: qwen3
    dtype: bfloat16
    device: cuda:0
    generation: {max_new_tokens: 256, do_sample: false}

  validator:
    id: google/gemma-3-4b-it
    revision: 093f9f388b31de276ce2de164bdc2081324b9767
    loader: gemma3
    dtype: bfloat16
    device: cuda:0
    generation: {max_new_tokens: 4, do_sample: false}

dataset:
  revision: c8f4f8c9465fb69d31a8eae894c3fd509c4ca321
  source_split: train
  num_questions: 30
  sampling:
    strategy: random

collection:
  protocol_version: v2
  active_conditions: [natural]
  layers: [4, 8, 17, 25, 29, 30, 31, 32, 33]
  seed: 42

output:
  run_name: natural_4b_full9_smoke_30q
  chunk_size: 10
