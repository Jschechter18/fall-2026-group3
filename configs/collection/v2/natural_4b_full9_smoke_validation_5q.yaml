# Smoke test for the nine-layer collection, MuSiQue-validation half: 5 questions
# with exactly the settings of natural_4b_full9_validation.yaml. Shares the run
# name with natural_4b_full9_smoke_30q.yaml so, like the real pair of configs,
# train.pt and validation.pt land in one activation directory. Checks the
# source-validation -> downstream `validation` partition path, which the train
# smoke cannot exercise.

roles:
  solver:
    id: google/gemma-3-4b-it
    revision: 093f9f388b31de276ce2de164bdc2081324b9767
    loader: gemma3
    dtype: bfloat16
    device: cuda:0
    generation: {max_new_tokens: 64, do_sample: false}

  critic:
    id: Qwen/Qwen3-4B-Instruct-2507
    revision: cdbee75f17c01a7cc42f958dc650907174af0554
    loader: qwen3
    dtype: bfloat16
    device: cuda:0
    generation: {max_new_tokens: 256, do_sample: false}

  validator:
    id: google/gemma-3-4b-it
    revision: 093f9f388b31de276ce2de164bdc2081324b9767
    loader: gemma3
    dtype: bfloat16
    device: cuda:0
    generation: {max_new_tokens: 4, do_sample: false}

dataset:
  revision: c8f4f8c9465fb69d31a8eae894c3fd509c4ca321
  source_split: validation
  num_questions: 5
  sampling:
    strategy: random

collection:
  protocol_version: v2
  active_conditions: [natural]
  layers: [4, 8, 17, 25, 29, 30, 31, 32, 33]
  seed: 42

output:
  run_name: natural_4b_full9_smoke_30q
  chunk_size: 5
