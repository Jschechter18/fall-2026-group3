# V2 collection protocol — smoke config (3 questions).
#
# V2 differs from V1 in how questions are chosen, not in what is collected:
#   - dataset.sampling: seeded stratified random sample over hop groups
#     instead of the first N rows in dataset order (V1 was 100 % 2-hop).
#   - dataset.experiment_split: a question-level scientific split
#     (discovery / validation / intervention), separate from the MuSiQue
#     source_split, shared by all three critic episodes of a question.
#
# PENDING TEAM SIGN-OFF — the numeric values below are placeholders that
# reproduce the plan's recommended defaults; they are NOT decided:
#   Q1  source_split policy (all questions from `train`, or train -> discovery
#       + validation and MuSiQue validation -> intervention)
#   Q2  hop_proportions (fixed 60/30/10 vs proportional 72/22/6)
#   Q1  experiment_split proportions (60/20/20)
# Change them here once the team decides; do not hard-code them elsewhere.

model:
  id: google/gemma-3-4b-it

dataset:
  source_split: train
  num_questions: 3
  sampling:
    strategy: stratified
    hop_proportions:
      2hop: 0.6
      3hop: 0.3
      4hop: 0.1
  experiment_split:
    proportions:
      discovery: 0.6
      validation: 0.2
      intervention: 0.2

collection:
  layers:
    - 8
    - 17
    - 25
    - 33
  seed: 42

output:
  run_name: v2_smoke_3q
