# Nine-layer Natural-condition 4B collection: MuSiQue validation (2,417).
# Same models, revisions, budgets and seed as the recorded four-layer run
# (natural_4b_full_validation.yaml); nine layers instead of four, under a NEW
# run name. Pairs with natural_4b_full9_train.yaml under the same run_name.
#
# Partitions are not assigned here; see natural_4b_full9_train.yaml. The
# historical experiment_split block is deliberately absent.
#
# sampling.strategy random over all 2,417 questions selects the whole split
# in a seeded shuffled order, so a partial run still mixes hop groups.
# Resumable: rerun with --resume after interruption.

roles:
  solver:
    id: google/gemma-3-4b-it
    revision: 093f9f388b31de276ce2de164bdc2081324b9767
    loader: gemma3
    dtype: bfloat16
    device: cuda:0
    generation: {max_new_tokens: 64, do_sample: false}

  critic:
    id: Qwen/Qwen3-4B-Instruct-2507
    revision: cdbee75f17c01a7cc42f958dc650907174af0554
    loader: qwen3
    dtype: bfloat16
    device: cuda:0
    generation: {max_new_tokens: 256, do_sample: false}

  validator:
    id: google/gemma-3-4b-it
    revision: 093f9f388b31de276ce2de164bdc2081324b9767
    loader: gemma3
    dtype: bfloat16
    device: cuda:0
    generation: {max_new_tokens: 4, do_sample: false}

dataset:
  revision: c8f4f8c9465fb69d31a8eae894c3fd509c4ca321
  source_split: validation
  num_questions: 2417
  sampling:
    strategy: random

collection:
  protocol_version: v2
  active_conditions: [natural]
  layers: [4, 8, 17, 25, 29, 30, 31, 32, 33]
  seed: 42

output:
  run_name: natural_4b_full9
  chunk_size: 250
