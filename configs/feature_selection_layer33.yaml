# SAE feature selection (issue #89) and the offline causal-proxy table, on layer 33.
# Same inputs as configs/layer_selection_full9.yaml: full9 export + Behavior v0.1.2 labels.
# Fit and rank on `train`, measure on `validation`; test and intervention are never read.
capstone_data_root: .
activations_dir: data/activations/natural_4b_full9_partitioned
results_dir: results/collection/natural_4b_full9_partitioned
labels_csv: results/behavior/behavior_v012_official_20261011/labels.csv
manifest_csv: results/behavior/behavior_v012_official_20261011/split_manifest.csv
index_column: full_index
layer: 33
activation_file: "{split}_attempt2.pt"
fit_partition: train
eval_partition: validation
saes:
  # s3://dats-capstone/shared/group3/results/sae/musique/runs/layer_33/<run>/checkpoints/
  TopK SAE:
    kind: custom
    path: results/sae/musique/runs/layer_33/20261013T233444019723Z-e5943205b957
  L1 SAE:
    kind: custom
    path: results/sae/musique/runs/layer_33/20261014T161949048498Z-edfc89a42125
  # https://huggingface.co/google/gemma-scope-2-4b-it/tree/main/resid_post_all/layer_33_width_16k_l0_big
  Pretrained SAE:
    kind: gemma_scope
    path: results/sae/pretrained/gemma-scope-2-4b-it/resid_post_all/layer_33_width_16k_l0_big
n_targeted: 10
n_random_draws: 50
n_top_report: 25
seed: 42
c_grid: [0.001, 0.01, 0.1, 1.0, 10.0]
inner_folds: 3
n_bootstrap: 1000
n_permutations: 10000
output_dir: results/feature_selection
